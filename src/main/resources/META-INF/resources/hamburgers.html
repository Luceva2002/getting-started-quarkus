<!doctype html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Hamburgers Recipes</title>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"
            integrity="sha256-FgpCb/KJQlLNfOu91ta32o/NMZxltwRo8QtmkMRdAu8=" crossorigin="anonymous"></script>
    <script type="application/javascript" src="hamburgers.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 8px 12px; text-align: left; vertical-align: top; }
        input { padding: 6px; margin-right: 8px; }
        button { padding: 6px 10px; cursor: pointer; }
        ul { margin: 0; padding-left: 18px; }
        .ingredient-row { margin-bottom: 6px; }
        .delete-link { color: #b00020; cursor: pointer; }
    </style>

<body>

<h1>Hamburgers Recipes</h1>

<h2>Create Recipe</h2>
<input id="hamburger-name" type="text" placeholder="Recipe name">
<button id="create-hamburger-button" type="button">Create recipe</button>

<h2>All Recipes</h2>
<div id="all-hamburgers"></div>

</body>
</html>
